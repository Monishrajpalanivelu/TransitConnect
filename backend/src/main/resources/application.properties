spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/TransitConnect}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:changeme}

# Scalability: HikariCP Connection Pool Tuning
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.connection-timeout=30000


spring.jpa.hibernate.ddl-auto=${DDL_AUTO:none}
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=${JWT_SECRET:changeme-generate-a-real-secret-key-here}

# Admin Delete Route Password
app.admin.delete-password=${ADMIN_DELETE_PASSWORD:changeme}

# Redis Caching Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.cache.type=redis
spring.cache.redis.time-to-live=600000

# Observability & Monitoring (Actuator + Prometheus)
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=TransitConnect

server.port=${PORT:8081}
server.error.include-message=always
